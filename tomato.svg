<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- stem -->
  <rect x="30" y="4"  width="4" height="8"  fill="#2d8a2d"/>
  <!-- leaves -->
  <rect x="22" y="8"  width="8" height="4"  fill="#3aaa3a"/>
  <rect x="34" y="8"  width="8" height="4"  fill="#3aaa3a"/>
  <rect x="26" y="6"  width="4" height="4"  fill="#3aaa3a"/>
  <rect x="34" y="6"  width="4" height="4"  fill="#3aaa3a"/>
  <!-- body -->
  <rect x="16" y="16" width="32" height="32" fill="#d63030"/>
  <rect x="12" y="20" width="40" height="24" fill="#d63030"/>
  <rect x="14" y="18" width="36" height="28" fill="#d63030"/>
  <!-- shading left -->
  <rect x="14" y="20" width="6"  height="22" fill="#c02020" opacity="0.5"/>
  <!-- highlight -->
  <rect x="20" y="20" width="8"  height="6"  fill="#f05050" opacity="0.6"/>
  <!-- ribs / lines -->
  <rect x="30" y="16" width="2"  height="30" fill="rgba(0,0,0,0.15)"/>
  <rect x="22" y="18" width="2"  height="28" fill="rgba(0,0,0,0.1)"/>
  <rect x="38" y="18" width="2"  height="28" fill="rgba(0,0,0,0.1)"/>
  <!-- shadow bottom -->
  <rect x="16" y="44" width="32" height="4"  fill="#a01818" opacity="0.5"/>
  <!-- clock tick marks on body -->
  <rect x="30" y="17" width="2" height="4" fill="rgba(255,255,255,0.6)"/>
  <rect x="43" y="29" width="4" height="2" fill="rgba(255,255,255,0.6)"/>
  <rect x="15" y="29" width="4" height="2" fill="rgba(255,255,255,0.6)"/>
  <!-- clock hand -->
  <rect x="31" y="27" width="2" height="8" fill="white"/>
  <rect x="29" y="33" width="6" height="2" fill="white"/>
  <!-- center dot -->
  <rect x="30" y="33" width="4" height="4" fill="white"/>
</svg>
